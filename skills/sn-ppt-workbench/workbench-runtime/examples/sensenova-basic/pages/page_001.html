<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw 产品介绍</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2196F3;
      --accent: #00BCD4;
      --neutral: #607D8B;
      --bg-dark: #0B0F1A;
      --bg-card: rgba(18, 30, 50, 0.6);
      --text-light: #E8F0FE;
      --text-muted: #A0B4CC;
      --border-glow: rgba(33, 150, 243, 0.25);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      background: #0B0F1A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .wrapper {
      width: 1600px;
      height: 900px;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
      background: var(--bg-dark);
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
    }
    #bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(33,150,243,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(0,188,212,0.08) 0%, transparent 50%),
        linear-gradient(180deg, #0B0F1A 0%, #111B2E 100%);
    }
    /* 网格纹理 */
    #bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(96,125,139,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(96,125,139,0.08) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    /* 科技感光晕粒子 */
    #bg::after {
      content: '';
      position: absolute;
      top: 10%;
      left: 15%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(33,150,243,0.08) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
    }
    #ct {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 60px 80px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* 顶部装饰线条 */
    .top-line {
      position: absolute;
      top: 30px;
      left: 80px;
      right: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      opacity: 0.4;
    }
    .top-line::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(0,188,212,0.6);
    }
    /* 主标题区域 */
    .hero {
      text-align: center;
      margin-bottom: 20px;
    }
    .hero-title {
      font-size: 72px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 4px;
      text-shadow: 0 0 40px rgba(33,150,243,0.3);
      position: relative;
      display: inline-block;
      padding: 0 20px;
    }
    .hero-title::before,
    .hero-title::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary));
    }
    .hero-title::before {
      left: -80px;
      background: linear-gradient(90deg, transparent, var(--primary));
    }
    .hero-title::after {
      right: -80px;
      background: linear-gradient(90deg, var(--primary), transparent);
    }
    .hero-title .glow {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 120%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      filter: blur(3px);
    }
    .hero-subtitle {
      font-size: 28px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 6px;
      margin-top: 12px;
      text-shadow: 0 0 20px rgba(0,188,212,0.3);
    }
    .hero-desc {
      font-size: 16px;
      font-weight: 300;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 820px;
      margin: 18px auto 0;
      letter-spacing: 1px;
      opacity: 0.85;
    }
    /* 三个核心模块 */
    .modules {
      display: flex;
      gap: 30px;
      margin-top: 50px;
      justify-content: center;
      flex-wrap: nowrap;
    }
    .module-card {
      background: var(--bg-card);
      border: 1px solid rgba(33,150,243,0.15);
      border-radius: 16px;
      padding: 28px 24px 24px;
      width: 320px;
      backdrop-filter: blur(4px);
      transition: border-color 0.3s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .module-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 20%;
      right: 20%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      opacity: 0.5;
      border-radius: 2px;
    }
    .module-card:hover {
      border-color: rgba(33,150,243,0.4);
      box-shadow: 0 0 30px rgba(33,150,243,0.08);
    }
    .module-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(33,150,243,0.08);
      border: 1px solid rgba(33,150,243,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      position: relative;
    }
    .module-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--primary);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .module-title {
      font-size: 18px;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .module-title span {
      /* wrapper for pseudo-element safety, but no pseudo needed */
    }
    .module-desc {
      font-size: 13px;
      font-weight: 300;
      color: var(--text-muted);
      line-height: 1.5;
    }
    /* 底部装饰 */
    .bottom-glow {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(0deg, rgba(33,150,243,0.04) 0%, transparent 100%);
      pointer-events: none;
    }
    /* 角落装饰点 */
    .corner-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0,188,212,0.5);
    }
    .corner-dot.tl { top: 40px; left: 60px; }
    .corner-dot.tr { top: 40px; right: 60px; }
    .corner-dot.bl { bottom: 40px; left: 60px; }
    .corner-dot.br { bottom: 40px; right: 60px; }
    /* 粒子 */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(33,150,243,0.15);
      pointer-events: none;
    }
    /* 屏幕适配 */
    @media (max-width: 1600px) {
      .wrapper { transform: scale(calc(100vw / 1600)); transform-origin: top left; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="bg"></div>
    <div id="ct">
      <!-- 顶部线条 -->
      <div class="top-line"></div>
      <!-- 角落装饰 -->
      <div class="corner-dot tl"></div>
      <div class="corner-dot tr"></div>
      <div class="corner-dot bl"></div>
      <div class="corner-dot br"></div>
      <!-- 粒子装饰 -->
      <div class="particle" style="width:8px;height:8px;top:12%;left:8%;background:rgba(0,188,212,0.12);"></div>
      <div class="particle" style="width:5px;height:5px;top:25%;right:10%;background:rgba(33,150,243,0.1);"></div>
      <div class="particle" style="width:10px;height:10px;bottom:20%;left:12%;background:rgba(96,125,139,0.08);"></div>
      <div class="particle" style="width:6px;height:6px;bottom:35%;right:18%;background:rgba(0,188,212,0.1);"></div>

      <!-- 主内容 -->
      <div class="hero">
        <div class="hero-title">
          <span>OpenClaw 产品介绍</span>
          <div class="glow"></div>
        </div>
        <div class="hero-subtitle">智能AI代理平台</div>
        <div class="hero-desc">
          OpenClaw 是一个新一代AI代理平台，融合大语言模型与自动化工具，<br>帮助企业实现业务流程的智能化和自主化。
        </div>
      </div>

      <!-- 三个模块 -->
      <div class="modules">
        <!-- 模块1：自主决策 -->
        <div class="module-card">
          <div class="module-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
          </div>
          <div class="module-title"><span>自主决策</span></div>
          <div class="module-desc">基于大模型的智能决策引擎，无需人工干预，自动分析并执行最优路径</div>
        </div>
        <!-- 模块2：多模型融合 -->
        <div class="module-card">
          <div class="module-icon">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A7.99 7.99 0 0 0 12 20a7.99 7.99 0 0 0 7.36-4.96z"></path>
              <path d="M4.62 9a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1h12.4a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.04-.04A7.99 7.99 0 0 0 12 4a7.99 7.99 0 0 0-7.36 4.96z"></path>
            </svg>
          </div>
          <div class="module-title"><span>多模型融合</span></div>
          <div class="module-desc">整合多种AI模型灵活切换，满足不同业务需求，发挥各模型优势</div>
        </div>
        <!-- 模块3：企业级部署 -->
        <div class="module-card">
          <div class="module-icon">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <path d="M12 12h.01"></path>
              <path d="M16 12h.01"></path>
              <path d="M8 16h.01"></path>
              <path d="M12 16h.01"></path>
              <path d="M16 16h.01"></path>
            </svg>
          </div>
          <div class="module-title"><span>企业级部署</span></div>
          <div class="module-desc">支持私有化部署，保障数据安全与合规，满足企业级高可用要求</div>
        </div>
      </div>

      <!-- 底部光晕 -->
      <div class="bottom-glow"></div>
    </div>
  </div>
</body>
</html>
