<!doctype html>
<html lang="zh-CN">

    .pairs li { display: flex; gap: 12px; }
    .foot .tag { display: inline-block; font-weight: 700; }

</head>
<body>
  <div class="wrapper">
    <div id="ct">
      <ul class="pairs">
        <li><span class="key">定义</span><span class="value">业主支付固定服务费，盈亏由物业自负</span></li>
      </ul>
      <div class="foot"><span class="tag">人工 40-60%</span> <span>含工资、五险一金、福利</span></div>
    </div>
  </div>
</body>
</html>
